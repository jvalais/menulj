<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menus RS de LJ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --green:#6f9d2f;
  --dark:#263238;
  --light:#f7f9f4;
  --border:#d8dfcf;
  --pink:#b04b9b;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  color:var(--dark);
  background:#fbfbf8;
}
header {
  position:sticky;
  top:0;
  z-index:10;
  background:white;
  border-bottom:1px solid var(--border);
  padding:1rem;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.wrap { max-width:1180px; margin:auto; }
h1 { margin:.2rem 0; color:var(--green); }
.top-actions {
  margin-top:.75rem;
  display:flex;
  gap:.75rem;
  flex-wrap:wrap;
  align-items:center;
}
.burger {
  margin-top:0;
  display:inline-flex;
  gap:.5rem;
  align-items:center;
  padding:.6rem .85rem;
  border:1px solid var(--green);
  border-radius:.55rem;
  background:var(--green);
  color:white;
  font-weight:bold;
}
.menu-panel {
  margin-top:.75rem;
  padding:.8rem;
  border:1px solid var(--border);
  border-radius:.8rem;
  background:var(--light);
}
.menu-panel[hidden] {
  display:none;
}
.controls {
  display:flex;
  gap:.75rem;
  flex-wrap:wrap;
  align-items:center;
  margin-top:.25rem;
}
input, button, select {
  font:inherit;
  padding:.55rem .7rem;
  border:1px solid var(--border);
  border-radius:.5rem;
  background:white;
}
button {
  cursor:pointer;
  background:var(--green);
  color:white;
  border-color:var(--green);
}
main { max-width:1180px; margin:1.25rem auto; padding:0 1rem 2rem; }
.info {
  padding:1rem;
  background:var(--light);
  border:1px solid var(--border);
  border-radius:.8rem;
  margin-bottom:1rem;
}
.week {
  margin:1.25rem 0;
  padding:1rem;
  background:white;
  border:1px solid var(--border);
  border-radius:1rem;
}
.week.hidden { display:none; }
.week h2 { margin:.2rem 0 1rem; color:var(--green); }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:.8rem;
}
.day {
  border:1px solid var(--border);
  border-radius:.8rem;
  padding:.8rem;
  background:#fff;
}
.day.today {
  outline:3px solid var(--pink);
  background:#fff8fd;
}
.day.selected {
  outline:3px solid var(--green);
}
.day h3 {
  margin:.1rem 0 .5rem;
  color:#333;
}
.badge {
  display:inline-block;
  margin:.15rem 0 .5rem;
  padding:.2rem .45rem;
  border-radius:999px;
  background:#f2e4f0;
  color:#87377a;
  font-size:.85rem;
  font-weight:bold;
}
.section-title {
  margin:.7rem 0 .2rem;
  font-weight:bold;
  color:var(--green);
}
ul {
  margin:.2rem 0 .4rem 1.1rem;
  padding:0;
}
li { margin:.15rem 0; }
.footer {
  margin-top:1.5rem;
  font-size:.92rem;
  color:#4f5b45;
}
mark {
  background:#e6f2d2;
  padding:.05rem .2rem;
  border-radius:.2rem;
}
@media (max-width:650px) {
  .controls, .top-actions { flex-direction:column; align-items:stretch; }
  .controls label, .controls input, .controls button, .top-actions button { width:100%; }
}
@media print {
  header { position:static; box-shadow:none; }
  button, .controls, .burger, .menu-panel { display:none; }
  .week.hidden { display:block; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>RS de LJ — Menus 2026</h1>
    <div class="top-actions">
      <button id="menuToggle" class="burger" type="button" aria-expanded="false" aria-controls="menuPanel">
        <span aria-hidden="true">☰</span>
        <span>Menu</span>
      </button>
      <button id="prevWeekBtn" type="button">← Semaine précédente</button>
      <button id="todayBtn" type="button">Aujourd’hui</button>
      <button id="nextWeekBtn" type="button">Semaine suivante →</button>
    </div>

    <nav id="menuPanel" class="menu-panel" aria-label="Options d’affichage" hidden>
      <div class="controls">
        <label for="datePicker">Date affichée :</label>
        <input type="date" id="datePicker">
        <button id="allBtn" type="button">Voir toutes les semaines</button>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="info" id="summary"></div>
  <div id="menus"></div>
  <div class="footer">
    <p><strong>Légende :</strong> BIO = produits biologiques ; LOCAL = produits régionaux ; MSC, HVE, AOP, VBF = produits labellisés.</p>
    <p>Menus susceptibles de variations, sous réserve des approvisionnements.</p>
  </div>
</main>

function parseLocalDate(value) {
  const [y,m,d] = value.split("-").map(Number);
  return new Date(y, m-1, d);
}

function formatDateISO(date) {
  return date.getFullYear() + "-" + String(date.getMonth()+1).padStart(2,"0") + "-" + String(date.getDate()).padStart(2,"0");
}

function isWithin(date, start, end) {
  const d = parseLocalDate(date), s = parseLocalDate(start), e = parseLocalDate(end);
  return d >= s && d <= e;
}

function renderMenus(selectedDate, showAll=false) {
  const container = document.getElementById("menus");
  container.innerHTML = "";
  const todayISO = formatDateISO(new Date());
  let foundDay = null;
  let foundWeek = null;

  menus.forEach((week, wi) => {
    const weekEl = document.createElement("section");
    weekEl.className = "week";
    weekEl.dataset.start = week.start;
    weekEl.dataset.end = week.end;
    if (!showAll && !isWithin(selectedDate, week.start, week.end)) {
      weekEl.classList.add("hidden");
    }

    const title = document.createElement("h2");
    title.textContent = week.periode;
    weekEl.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "grid";

    week.jours.forEach(day => {
      const card = document.createElement("article");
      card.className = "day";
      if (day.date === todayISO) card.classList.add("today");
      if (day.date === selectedDate) {
        card.classList.add("selected");
        foundDay = day;
        foundWeek = week;
      }

      card.innerHTML = `
        <h3>${day.jour}</h3>
        ${day.theme ? `<div class="badge">${day.theme}</div>` : ""}
        <div class="section-title">Entrée(s)</div>
        ${day.entrees.length ? `<ul>${day.entrees.map(x=>`<li>${x}</li>`).join("")}</ul>` : `<p>—</p>`}
        <div class="section-title">Plat</div>
        <p>${day.plat || "—"}</p>
        <div class="section-title">Accompagnement</div>
        <p>${day.accompagnement || "—"}</p>
        <div class="section-title">Fromage / laitage</div>
        <p>${day.fromage || "—"}</p>
        <div class="section-title">Dessert(s)</div>
        ${day.desserts.length ? `<ul>${day.desserts.map(x=>`<li>${x}</li>`).join("")}</ul>` : `<p>—</p>`}
      `;
      grid.appendChild(card);
    });

    weekEl.appendChild(grid);
    container.appendChild(weekEl);
  });

  const summary = document.getElementById("summary");
  if (foundDay) {
    summary.innerHTML = `<strong>Menu affiché par défaut :</strong> <mark>${foundDay.jour}</mark><br>
    Semaine : ${foundWeek.periode}`;
  } else {
    summary.innerHTML = `<strong>Aucun menu trouvé pour la date sélectionnée.</strong><br>
    Les menus intégrés couvrent la période de septembre 2025 à octobre 2026.`;
  }
}

const menuToggle = document.getElementById("menuToggle");
const menuPanel = document.getElementById("menuPanel");

menuToggle.addEventListener("click", () => {
  const isOpen = menuToggle.getAttribute("aria-expanded") === "true";
  menuToggle.setAttribute("aria-expanded", String(!isOpen));
  menuPanel.hidden = isOpen;
});

const datePicker = document.getElementById("datePicker");
datePicker.value = formatDateISO(new Date());
renderMenus(datePicker.value);

function currentWeekIndex(selectedDate) {
  const exact = menus.findIndex(week => isWithin(selectedDate, week.start, week.end));
  if (exact !== -1) return exact;

  const selected = parseLocalDate(selectedDate);
  for (let i = 0; i < menus.length; i++) {
    if (selected < parseLocalDate(menus[i].start)) return i;
  }
  return menus.length - 1;
}

function goToWeek(direction) {
  const index = currentWeekIndex(datePicker.value);
  const nextIndex = Math.min(Math.max(index + direction, 0), menus.length - 1);
  datePicker.value = menus[nextIndex].start;
  renderMenus(datePicker.value);
}

datePicker.addEventListener("change", () => renderMenus(datePicker.value));

document.getElementById("prevWeekBtn").addEventListener("click", () => goToWeek(-1));

document.getElementById("nextWeekBtn").addEventListener("click", () => goToWeek(1));

document.getElementById("todayBtn").addEventListener("click", () => {
  datePicker.value = formatDateISO(new Date());
  renderMenus(datePicker.value);
});

document.getElementById("allBtn").addEventListener("click", () => renderMenus(datePicker.value, true));
</script>
